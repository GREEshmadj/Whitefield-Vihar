  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background: url('images/about banner.jpg') center/cover no-repeat;
      height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      font-family: 'Playfair Display', serif;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
    }

    header h1, header p {
      position: relative;
      z-index: 2;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5em;
    }

    header p {
      font-size: 1.2rem;
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      padding: 1.2rem;
    }
    .gallery-container img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }


    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 10px;
    }

    .lightbox.active {
      display: flex;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .gallery-container {
        column-count: 2;
      }
    }
    @media (max-width: 600px) {
      .gallery-container {
        column-count: 1;
      }
      header h1 {
        font-size: 1.8rem;
      }
      header p {
        font-size: 1rem;
      }
    }

    .back-btn {
      display: block;
      margin: 3em auto 2em;
      background: #d6b358;
      color: #000;
      padding: 0.8em 2em;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      width: fit-content;
      transition: background 0.3s ease;
    }
    .back-btn:hover {
      background: #c9a747;
    }
  </style>
</head>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const closeBtn = document.querySelector('.close');
    document.querySelectorAll('.gallery-container img').forEach(img => {
      img.addEventListener('click', () => {
        lightbox.classList.add('active');
        lightboxImg.src = img.src;
      });
    });
    closeBtn.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });
  </script>
